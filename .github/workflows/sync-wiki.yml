name: Sync wiki

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main repo
        uses: actions/checkout@v4

      - name: Clone wiki repo
        run: |
          git clone https://x-access-token:${{ github.token }}@github.com/LucasNoeller/HowToBelegarbeit.wiki.git wiki-repo

      - name: Mirror wiki files
        run: |
          rsync -av --delete wiki-draft/ wiki-repo/

      - name: Commit and push
        run: |
          cd wiki-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Sync wiki content from main repo" || echo "No changes to commit"
          git push
