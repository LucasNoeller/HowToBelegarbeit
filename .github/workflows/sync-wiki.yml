name: Sync wiki

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "wiki-draft/**"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main repo
        uses: actions/checkout@v4

      - name: Clone wiki repo
        run: |
          git clone https://x-access-token:${{ github.token }}@github.com/LucasNoeller/HowToBelegarbeit.wiki.git wiki-repo

      - name: Copy wiki files
        run: |
          cp -v wiki-draft/*.md wiki-repo/

      - name: Commit and push
        run: |
          cd wiki-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Initial wiki content" || echo "No changes to commit"
          git push
